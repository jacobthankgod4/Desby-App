name: desby_app
description: "Desby OS - Digital operating system for tailors and fashion entrepreneurs."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI & Material Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # State Management & Dependency Injection
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  url_launcher: ^6.2.5
  supabase_flutter: ^2.6.0
  riverpod_annotation: ^2.3.0

  # Networking
  dio: ^5.3.1
  pretty_dio_logger: ^1.3.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Security
  flutter_secure_storage: ^9.0.0

  # Serialization & Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5

  # Utilities
  logger: ^2.0.1
  intl: ^0.19.0
  connectivity_plus: ^5.0.0
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1
  dartz: ^0.10.1
  web: ^0.4.2
  webview_flutter: ^4.7.0
  path_provider: ^2.1.1
  google_mlkit_pose_detection: ^0.9.0

# Environment & Configuration
  flutter_dotenv: ^5.1.0
  o3d: ^3.1.0
  flutterwave_standard: ^1.0.8
  image_picker: ^1.0.0
  geolocator: ^10.1.0
  latlong2: ^0.9.0
  flutter_map: ^6.1.0
  uuid: ^4.6.0
  screen_protector: ^1.5.3
  pod_player: ^0.2.2
  confetti: ^0.8.0
  flutter_tts: ^4.2.2
  camera: ^0.11.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

  # Code Generation
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.9
  freezed: ^2.4.1
  json_serializable: ^6.7.1

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.0

dependency_overrides:
  web: ^1.0.0
  http: ^1.2.0
  package_info_plus: ^8.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  background_color: "#1B3022"
  adaptive_icon_background: "#1B3022"
  adaptive_icon_foreground: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#1B3022"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/guidance/
    - assets/models/
