# ============================================================================
# Desby OS — Nginx config for EC2 deployment
# ============================================================================
# Place this at: /etc/nginx/sites-available/desby.app
# Then: sudo ln -s /etc/nginx/sites-available/desby.app /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# PREREQUISITES:
#   1. Point desby.app DNS A record to this EC2's public IP
#   2. Install certbot: sudo apt install certbot python3-certbot-nginx
#   3. Run: sudo certbot --nginx -d desby.app
# ============================================================================

# Rate limiting zone (protects API from abuse)
limit_req_zone $binary_remote_addr zone=desby_api:10m rate=30r/s;

# Upstream — Korra backend running locally on this EC2 (Docker container: korra-ai-prod)
# Port 8080 confirmed via: sudo ss -tlnp | grep LISTEN
upstream korra_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name desby.app www.desby.app;

    # Redirect HTTP → HTTPS (uncomment after certbot)
    # return 301 https://$server_name$request_uri;

    # --------------------------------------------------
    # Flutter Web Build — static files
    # --------------------------------------------------
    root /var/www/desby/web;
    index index.html;

    # --------------------------------------------------
    # Flutter entry files — NEVER cache.
    # main.dart.js is NOT content-hashed by Flutter (stable filename), so an
    # immutable/1y header pins users to a stale bundle after every deploy and
    # mixed old/new assets break routing. These must revalidate each load.
    # (Exact-match locations win over the regex rules below.)
    # --------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location = /flutter.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Flutter web routing — all routes serve index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------
    # API Proxy → Korra backend (same EC2, localhost)
    # --------------------------------------------------
    location /api/ {
        # Pass to Korra backend on localhost
        proxy_pass http://korra_backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection keepalive (faster repeated requests)
        proxy_set_header Connection "";

        # Timeouts — generous since extract can be slow server-side
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # No buffering for streaming responses
        proxy_buffering off;

        # Rate limit
        limit_req zone=desby_api burst=20 nodelay;
        limit_req_status 429;
    }

    # --------------------------------------------------
    # Korra health check (no rate limit)
    # --------------------------------------------------
    location = /api/v2/health {
        proxy_pass http://korra_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # --------------------------------------------------
    # Static assets
    # canvaskit/*.js|wasm keep stable filenames across Flutter versions,
    # so they must NOT be immutable/1y (pins stale engine after upgrade).
    # --------------------------------------------------
    location ~* \.(wasm|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --------------------------------------------------
    # Service Worker — never cache (controls app updates)
    # --------------------------------------------------
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # --------------------------------------------------
    # Security headers
    # --------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------
    # Gzip compression
    # --------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;
    gzip_min_length 256;
    gzip_vary on;

    # --------------------------------------------------
    # Error pages
    # --------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

