<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Desby OS - Digital operating system for tailors and fashion entrepreneurs.">

  <!-- Performance: Preload critical resources -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="logo.webp" as="image">

  <!-- iOS meta tags & icons -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Desby OS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="logo.webp"/>

  <title>Desby OS</title>
  <link rel="manifest" href="manifest.json">

<!-- External SDKs intentionally omitted.
       This app must boot even when CDNs are blocked/offline.
       Firebase is initialized from Dart via firebase_core (no JS CDN needed).
       3D viewer cross-platform: o3d for mobile, direct model-viewer for web. -->

  <!-- model-viewer for web platform (Standard CDN approach with non-blocking check) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js" defer></script>

  <!-- MediaPipe Vision for web pose detection (matches ML Kit on mobile) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm/vision_wasm_internal.js" defer></script>

<style>
    body {
      background-color: #0A1921; /* Dark Navy matches main app */
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .logo-container {
      margin-bottom: 40px;
    }
    .logo {
      width: 120px;
      height: 120px;
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }
    #status {
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 2px;
      opacity: 0.7;
      text-transform: uppercase;
    }
    
    /* 3D Model Viewer enhancements */
    model-viewer {
      width: 100%;
      height: 100%;
      min-height: 300px;
      background-color: transparent;
      --poster-color: transparent;
    }
    model-viewer::part(default-progress-bar) {
      background-color: #D4AF37 !important; /* Amber color */
    }
    model-viewer .progress-bar {
      display: block !important;
      background-color: #D4AF37;
    }
    model-viewer .progress-bar.hide {
      display: none;
    }
    model-viewer .error {
      display: block !important;
      background-color: red;
      color: white;
    }
  </style>
</head>
<body>
  <div id="app-shell" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <div class="logo-container">
      <img src="logo.webp" alt="Desby OS" class="logo" width="120" height="120">
    </div>
    <div id="status">Initializing Engine</div>
  </div>

<script src="flutter_bootstrap.js" defer></script>
<script>
    // Global error handler to catch and suppress Flutter runtime errors
    // particularly removeChild errors during debugging communication
    window.onerror = function(message, source, lineno, colno, error) {
      // Suppress removeChild errors during DOM manipulation
      if (message && message.includes && message.includes('removeChild')) {
        console.log("[DEBUG] Suppressed DOM error:", message);
        return true; // Prevent default error handling
      }
      return false; // Let other errors propagate
    };
    
    // Capture unhandled promise rejections
    window.addEventListener('unhandledrejection', function(event) {
      if (event.reason && event.reason.message &&
          event.reason.message.includes('removeChild')) {
        console.log("[DEBUG] Suppressed unhandled rejection:", event.reason.message);
        event.preventDefault();
      }
    });

    console.log("[DEBUG] Desby OS: Handshaking with Browser...");
    window.addEventListener('load', function() {
      const statusEl = document.getElementById('status');
      if (statusEl) statusEl.innerText = "Syncing Neural Assets";
      console.log("[DEBUG] All Scripts Loaded Successfully");

      // Safe preloader cleanup: use remove() method with proper null checks
      // This avoids the removeChild error when parent reference is stale
      const shell = document.getElementById('app-shell');

      // Use requestAnimationFrame + animation frame to ensure Flutter has attached first
      const removePreloader = () => {
        if (!shell || !document.body.contains(shell)) {
          return; // Already removed or not in DOM
        }

        // Use modern remove() with fallback for older browsers
        try {
          if (typeof shell.remove === 'function') {
            shell.remove();
          } else if (shell.parentNode) {
            shell.parentNode.removeChild(shell);
          }
        } catch (e) {
          // Silently ignore - element was already removed or DOM was modified
          console.log("[DEBUG] Preloader cleanup skipped:", e.message);
        }
      };

      // Defer removal to ensure Flutter has had time to initialize
      setTimeout(removePreloader, 1500);
    });
  </script>
</body>
</html>
