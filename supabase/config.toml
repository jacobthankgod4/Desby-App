[project]
# id = "sakmdeacligrqayfxyb"  # Uncomment and set your Supabase project ID

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17  # matches the remote project; do not lower this or
                       # `supabase config push` will try to change the live DB

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://desby.app/app"  # the Flutter app; the bare origin is the marketing site
additional_redirect_urls = [
  "https://desby.app/app/verify-email",
  "https://desby.app/app",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_confirmations = true
double_confirm_changes = true
enable_signup = true

[auth.email.smtp]
# Credentials are supplied by the environment; never commit them.
# See docs/SECRETS.md for how they are injected on the host.
host = "smtp-relay.brevo.com"
port = 587
user = "${BREVO_SMTP_USER}"
pass = "${BREVO_SMTP_PASS}"
sender_name = "Desby"
admin_email = "support@desby.app"

[auth.email.template.confirmation]
subject = "Confirm your Desby OS account"
content_path = "supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Desby OS password"
content_path = "supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Sign in to Desby OS"
content_path = "supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "You're invited to join Desby OS"
content_path = "supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Confirm your identity for Desby OS"
content_path = "supabase/templates/reauthentication.html"

[auth.email.template.email_change]
subject = "Confirm your new email for Desby OS"
content_path = "supabase/templates/email_change.html"

[auth.sms]
enable_signup = false



[analytics]
enabled = false

[experimental]
# imgproxy_enabled = true

[functions.flutterwave-pay]
# The client only supplies amount/email/order_id; the server re-reads the total
# from the database, so a tampered client amount cannot lower the price.
verify_jwt = true

[functions.flutterwave-verify]
# Called right after the browser SDK claims success. Must stay reachable by an
# authenticated client, but it verifies the transaction with Flutterwave using
# the secret key before settling anything with service_role.
verify_jwt = true

[functions.admin-invite-user]
# Admin-only. The caller's JWT is re-checked against the SECURITY DEFINER
# is_admin() RPC before any invite is sent, so the browser never needs a
# service_role key.
verify_jwt = true
